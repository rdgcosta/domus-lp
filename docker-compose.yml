version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: domus-italinea-app
    restart: unless-stopped
    networks:
      - web
    environment:
      - NODE_ENV=production

  nginx:
    image: nginx:alpine
    container_name: domus-italinea-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - app
    networks:
      - web

networks:
  web:
    driver: bridge
